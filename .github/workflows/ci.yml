name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - 'README.md'
      - 'PROTOCOL.md'
      - 'PLAN-*.md'
      - 'LICENSE-*'
      - 'NOTICE'
      - '.envrc'
      # Never enters the build. A release commit always moves Cargo.toml, which
      # is not ignored, so the release job below still fires for one.
      - 'Makefile'
      - '.github/release-notes/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'PROTOCOL.md'
      - 'PLAN-*.md'
      - 'LICENSE-*'
      - 'NOTICE'
      - '.envrc'
      - 'Makefile'
      - '.github/release-notes/**'
  # Escape hatch: re-run a release whose job failed partway. Both steps below
  # are idempotent, so a second run finishes what the first one started.
  workflow_dispatch:

jobs:
  build:
    # macOS compiles the keystroke, Accessibility and LaunchAgent code that
    # Linux skips; Linux compiles the hidraw backend tmux-legion builds on.
    strategy:
      # A failure on one system shouldn't hide the other's result.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          # v21 made Determinate Nix the default; keep upstream Nix.
          determinate: false
      - name: Build
        run: nix build --print-build-logs
      - name: Test and lint
        # Single devShell invocation: each `nix develop` pays a flake eval.
        run: |
          nix develop --command bash -euc '
            cargo test
            cargo clippy --all-targets -- -D warnings
            cargo fmt --check
          '

  # Publishes only when HEAD is a release commit, and only after build is green
  # on both systems — the tag can't run ahead of the tests the way hand-tagging
  # could. A release is the tag and its notes: users build from source.
  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    # The repo's default workflow permission is read, so this has to be asked
    # for explicitly or the tag push comes back 403.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags, for the already-published check below.
          fetch-depth: 0

      # Read the subject from git rather than github.event.head_commit.message,
      # which carries the body too and would match a commit that merely
      # mentions a release.
      - name: Is this a release commit?
        id: gate
        run: |
          version=$(awk -F'"' '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version/{print $2; exit}' Cargo.toml)
          tag="v$version"
          subject=$(git log -1 --format=%s)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if grep -q "release: $tag$" <<<"$subject"; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "publishing $tag from: $subject"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "not a release commit for $tag, nothing to do: $subject"
          fi

      - name: Check the notes
        if: steps.gate.outputs.should_release == 'true'
        env:
          TAG: ${{ steps.gate.outputs.tag }}
        run: |
          notes=".github/release-notes/$TAG.md"
          [ -s "$notes" ] || { echo "no notes at $notes — run 'make notes' and commit them" >&2; exit 1; }

      - name: Tag
        if: steps.gate.outputs.should_release == 'true'
        env:
          TAG: ${{ steps.gate.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already on origin, leaving it alone"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "mx-keypad $TAG"
          git push origin "$TAG"

      - name: Publish
        if: steps.gate.outputs.should_release == 'true'
        env:
          TAG: ${{ steps.gate.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, leaving it alone"
            exit 0
          fi
          gh release create "$TAG" --verify-tag --title "mx-keypad $TAG" \
            --notes-file ".github/release-notes/$TAG.md" --latest
